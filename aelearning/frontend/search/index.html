<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — Keyframe</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/pages.css" />
  <style>
    .search-hero-input {
      width: 100%; max-width: 640px; margin-top: 24px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--card-radius); padding: 14px 18px;
      font-family: var(--font-body); font-size: 15px; color: var(--text-primary);
      outline: none; transition: border-color var(--transition);
    }
    .search-hero-input:focus { border-color: var(--accent); }
    .search-hero-input::placeholder { color: var(--text-secondary); }

    .search-section-title {
      font-family: var(--font-display); font-size: 14px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--text-primary);
      margin: 40px 0 16px; padding-bottom: 10px; border-bottom: 2px solid var(--accent);
    }
    .search-empty {
      padding: 60px 0; text-align: center; color: var(--text-secondary);
      font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .video-list-header {
      display: grid; grid-template-columns: 48px 100px 1fr auto auto auto;
      gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--border);
    }
    .vlh-col { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-secondary); }
    .search-video-row { grid-template-columns: 48px 100px 1fr auto auto auto; }

    .search-creators-row {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .search-creator-card {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--card-radius); padding: 14px; cursor: pointer;
      transition: border-color var(--transition);
    }
    .search-creator-card:hover { border-color: var(--accent); }
    .sc-avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 16px; color: #fff; overflow: hidden;
    }
    .sc-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sc-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .sc-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }

    @media (max-width: 680px) {
      .video-list-header { grid-template-columns: 40px 72px 1fr auto; }
      .video-list-header .vlh-col:nth-child(4) { display: none; }
      .search-video-row { grid-template-columns: 40px 72px 1fr auto; }
      .search-video-row .vr-duration, .search-video-row .vr-yt { display: none; }
    }
  </style>
</head>
<body>
<script src="/transitions.js"></script>
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-logo">KEYFRAME <span class="nav-logo-tag">ArsynFX</span></a>
    <ul class="nav-links">
      <li><a href="/roadmap">Roadmap</a></li>
      <li><a href="/playlists">Playlists</a></li>
      <li><a href="/creators">Creators</a></li>
      <li><a href="/courses">Courses</a></li>
    </ul>
    <div class="nav-actions" id="nav-actions"></div>
    <button class="nav-hamburger" id="nav-hamburger"><span></span><span></span><span></span></button>
  </nav>
  <div class="mobile-nav" id="mobile-nav">
    <ul>
      <li><a href="/roadmap" class="mobile-nav-link">Roadmap</a></li>
      <li><a href="/playlists" class="mobile-nav-link">Playlists</a></li>
      <li><a href="/creators" class="mobile-nav-link">Creators</a></li>
      <li><a href="/courses" class="mobile-nav-link">Courses</a></li>
    </ul>
  </div>

  <div class="page-hero">
    <div class="container">
      <div class="breadcrumb">
        <a href="/">HOME</a><span class="breadcrumb-sep">/</span>SEARCH
      </div>
      <span class="section-number">FIND SOMETHING</span>
      <h1 class="page-title">SEARCH.</h1>
      <input type="text" class="search-hero-input" id="search-input" placeholder="Search videos, creators, techniques..." />
    </div>
  </div>

  <section style="padding:48px 0 100px;">
    <div class="container" id="results-wrap">
      <div class="search-empty" id="search-idle">Type something above to search across every video and creator on Keyframe.</div>
    </div>
  </section>

  <footer class="footer">
    <div style="border-top:1px solid var(--border);padding:20px 40px;max-width:1280px;margin:0 auto;">
      <p style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-secondary);">© 2025 KEYFRAME &nbsp;·&nbsp; MADE BY <a href="https://arsynfx.social/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600;">ARSYNFX</a></p>
    </div>
  </footer>

  <script src="/shared.js"></script>
  <script src="/progress.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('search-input');
    const wrap = document.getElementById('results-wrap');
    input.value = params.get('q') || '';

    function buildVideoRow(v, idx) {
      const div = document.createElement('div');
      div.className = 'video-row search-video-row';
      const thumb = v.youtube_id
        ? `<img src="https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg" alt="" loading="lazy">`
        : `<div class="vr-thumb-placeholder">▶</div>`;
      div.innerHTML = `
        <div class="vr-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="vr-thumb">${thumb}</div>
        <div class="vr-info">
          <div class="vr-title">${escHtml(v.title)}</div>
          <div class="vr-creator">${escHtml(v.creators?.name||'Unknown channel')}</div>
        </div>
        <span class="vr-duration">${escHtml(v.duration||'—')}</span>
        <a href="${escHtml(v.youtube_url || (v.youtube_id ? `https://www.youtube.com/watch?v=${v.youtube_id}` : '#'))}" target="_blank" rel="noopener" class="vr-yt wt-btn" title="Open on YouTube">YT ↗</a>
        <div class="vr-play">PLAY ▶</div>`;
      div.querySelector('.vr-yt').addEventListener('click', e => e.stopPropagation());
      div.addEventListener('click', () => openModal(v));
      return div;
    }

    function buildCreatorCard(c) {
      const div = document.createElement('div');
      div.className = 'search-creator-card';
      const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const avatar = c.avatar_url
        ? `<img src="${escHtml(c.avatar_url)}" alt="" onerror="this.remove();this.parentElement.textContent='${initials}';">`
        : initials;
      div.innerHTML = `
        <div class="sc-avatar">${avatar}</div>
        <div>
          <div class="sc-name">${escHtml(c.name)}</div>
          <div class="sc-sub">${escHtml(c.subscriber_count ? c.subscriber_count + ' subs' : (c.specialty || 'Creator'))}</div>
        </div>`;
      div.addEventListener('click', () => { window.location = '/creators'; });
      return div;
    }

    function render(data, q) {
      wrap.innerHTML = '';
      const total = (data.videos?.length || 0) + (data.creators?.length || 0);
      if (!total) {
        wrap.innerHTML = `<div class="search-empty">No results for "${escHtml(q)}" — try a different term.</div>`;
        return;
      }
      if (data.creators?.length) {
        const title = document.createElement('div');
        title.className = 'search-section-title';
        title.textContent = `CREATORS (${data.creators.length})`;
        wrap.appendChild(title);
        const grid = document.createElement('div');
        grid.className = 'search-creators-row';
        data.creators.forEach(c => grid.appendChild(buildCreatorCard(c)));
        wrap.appendChild(grid);
      }
      if (data.videos?.length) {
        const title = document.createElement('div');
        title.className = 'search-section-title';
        title.textContent = `VIDEOS (${data.videos.length})`;
        wrap.appendChild(title);
        const header = document.createElement('div');
        header.className = 'video-list-header';
        header.innerHTML = `
          <span class="vlh-col">#</span><span class="vlh-col">PREVIEW</span>
          <span class="vlh-col">TITLE</span><span class="vlh-col">DURATION</span>
          <span class="vlh-col">YT</span><span class="vlh-col" style="text-align:right;">PLAY</span>`;
        wrap.appendChild(header);
        const list = document.createElement('div');
        list.className = 'video-list';
        data.videos.forEach((v, i) => list.appendChild(buildVideoRow(v, i)));
        wrap.appendChild(list);
      }
    }

    let searchTimer;
    async function runSearch() {
      const q = input.value.trim();
      const newUrl = q ? `/search?q=${encodeURIComponent(q)}` : '/search';
      history.replaceState(null, '', newUrl);
      if (!q) {
        wrap.innerHTML = '<div class="search-empty">Type something above to search across every video and creator on Keyframe.</div>';
        return;
      }
      wrap.innerHTML = '<div class="search-empty">SEARCHING...</div>';
      try {
        const data = await apiFetch(`/search?q=${encodeURIComponent(q)}`);
        render(data, q);
      } catch {
        wrap.innerHTML = '<div class="search-empty">Search failed — try again.</div>';
      }
    }

    input.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 350);
    });
    input.focus();
    if (input.value) runSearch();
  </script>
</body>
</html>
